[project]
name = "app"
version = "0.1.0"
description = "Finance Harness backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sse-starlette>=2.1",
  "pydantic>=2.8",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "httpx>=0.27",
  "python-ulid>=2.7",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "yfinance>=0.2.43",
  "readability-lxml>=0.8.1",
  "markdownify>=0.13",
  "lxml[html_clean]>=5.2",
  "praw>=7.7",
  "langchain-core>=1.6.5",
  "langchain-anthropic>=1.7.4",
  "langchain-openai>=1.6.6",
  "langchain-google-genai>=4.4.0",
  "langgraph>=0.2.60",
  "langgraph-checkpoint-sqlite>=2.0.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "freezegun>=1.5",
  "ruff>=0.7",
  "mypy>=1.11",
  "import-linter>=2.1",
  "pandas-stubs>=2.2",
  "types-PyYAML>=6.0",
  "hypothesis>=6.112",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["app.domain.*", "app.harness.*"]
strict = true

[[tool.mypy.overrides]]
module = ["yfinance.*", "readability.*", "markdownify.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "live: hits real network/vendor APIs; skipped unless -m live is passed explicitly",
]
testpaths = ["tests"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is framework-free (F2)"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
  "langgraph",
  "langchain",
  "langchain_core",
  "fastapi",
  "sqlalchemy",
  "app.harness",
  "app.api",
]

[[tool.importlinter.contracts]]
name = "Harness does not import API"
type = "forbidden"
source_modules = ["app.harness"]
forbidden_modules = ["app.api"]
